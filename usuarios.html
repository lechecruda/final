<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GamerVault - Manejo de Usuarios</title>
  <style>
    :root {
      --bg-dark: #0a0814;
      --card-bg: #15102a;
      --border-color: #2e2055;
      --accent-purple: #a855f7;
      --accent-neon-purple: #d8b4fe;
      --accent-glow: #9333ea;
      --text-main: #f3e8ff;
      --text-muted: #a78bfa;
      --danger: #f43f5e;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

    header {
      background-color: var(--card-bg);
      border-bottom: 2px solid var(--accent-glow);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo { color: var(--accent-neon-purple); font-size: 1.5rem; text-transform: uppercase; font-weight: bold; }
    nav a { color: var(--text-muted); text-decoration: none; margin-left: 1.5rem; font-weight: 600; }
    nav a:hover, nav a.active { color: var(--accent-neon-purple); text-shadow: 0 0 8px var(--accent-glow); }

    .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; width: 100%; }

    .form-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }

    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
    .input-group { display: flex; flex-direction: column; gap: 0.4rem; }
    .input-group label { font-size: 0.85rem; color: var(--text-muted); }
    .input-group input, .input-group select {
      background-color: var(--bg-dark);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.6rem;
      border-radius: 4px;
      outline: none;
    }

    .btn { padding: 0.6rem 1.2rem; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; text-transform: uppercase; font-size: 0.8rem; }
    .btn-primary { background-color: var(--accent-purple); color: white; margin-top: 1rem; }
    .btn-danger { background-color: var(--danger); color: white; }

    table { width: 100%; border-collapse: collapse; background-color: var(--card-bg); border-radius: 8px; overflow: hidden; }
    th, td { padding: 0.8rem 1rem; border-bottom: 1px solid var(--border-color); text-align: left; }
    th { background-color: #0d0a1d; color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; }

    .badge-active { color: var(--success); font-weight: bold; }
    .badge-inactive { color: var(--danger); font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <div class="logo">🎮 GamerVault</div>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="productos.html">Catálogo</a>
      <a href="gestion.html">Gestión (CRUD)</a>
      <a href="usuarios.html" class="active">Usuarios</a>
      <a href="login.html" style="color: var(--accent-neon-purple); border: 1px solid var(--accent-purple); padding: 0.3rem 0.8rem; border-radius: 4px;">Login</a>
    </nav>
  </header>

  <div class="container">
    <div class="form-card">
      <h2 id="form-title">Control y Edición de Usuarios</h2>
      <br>
      <form id="user-form">
        <input type="hidden" id="u-id">
        <div class="form-grid">
          <div class="input-group">
            <label>Nombre(s)</label>
            <input type="text" id="u-nombre" placeholder="Ej. Alex" required>
          </div>
          <div class="input-group">
            <label>Apellido Paterno</label>
            <input type="text" id="u-appaterno" placeholder="Ej. Ramírez" required>
          </div>
          <div class="input-group">
            <label>Apellido Materno</label>
            <input type="text" id="u-apmaterno" placeholder="Ej. Gómez">
          </div>
          <div class="input-group">
            <label>Nombre de Usuario (Login)</label>
            <input type="text" id="u-usuario" placeholder="Ej. aramirez" required>
          </div>
          <div class="input-group">
            <label>Correo Electrónico</label>
            <input type="email" id="u-correo" placeholder="usuario@gamervault.com" required>
          </div>
          <div class="input-group">
            <label>Teléfono</label>
            <input type="tel" id="u-telefono" placeholder="7441234567">
          </div>
          <div class="input-group">
            <label>RFC / CURP</label>
            <input type="text" id="u-identificacion" placeholder="RAMA900101XXX">
          </div>
          <div class="input-group">
            <label>Dirección</label>
            <input type="text" id="u-direccion" placeholder="Av. Principal #123">
          </div>
          <div class="input-group">
            <label>Contraseña (Dejar vacío para conservar la actual al editar)</label>
            <input type="password" id="u-password" placeholder="••••••••">
          </div>
          <div class="input-group">
            <label>Rol de Usuario</label>
            <select id="u-rol" required>
              <option value="Administrador">Administrador</option>
              <option value="Operador de Almacén">Operador de Almacén</option>
              <option value="Solo Lectura">Solo Lectura</option>
            </select>
          </div>
          <div class="input-group">
            <label>Estado del Acceso</label>
            <select id="u-estado" required>
              <option value="Activo">Activo</option>
              <option value="Inactivo">Inactivo</option>
            </select>
          </div>
        </div>
        <div style="display: flex; gap: 1rem; align-items: center;">
          <button type="submit" id="btn-user-submit" class="btn btn-primary">Guardar Registro</button>
          <button type="button" id="btn-cancel" class="btn" style="background-color: #4b5563; color: white; margin-top: 1rem; display: none;" onclick="limpiarFormulario()">Cancelar Edición</button>
        </div>
      </form>
    </div>

    <table>
      <thead>
        <tr>
          <th>Usuario</th>
          <th>Nombre Completo</th>
          <th>Correo</th>
          <th>Teléfono</th>
          <th>Rol</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="usuarios-tbody">
      </tbody>
    </table>
  </div>

<script>
  const API_USERS = '/api/usuarios';
  let listaUsuariosCache = [];

  async function cargarUsuarios() {
    try {
      const res = await fetch(API_USERS);
      const usuarios = await res.json();
      listaUsuariosCache = usuarios;
      const tbody = document.getElementById('usuarios-tbody');
      tbody.innerHTML = '';

      if (!Array.isArray(usuarios) || usuarios.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:var(--text-muted);">Sin usuarios registrados en la base de datos</td></tr>';
        return;
      }

      usuarios.forEach(u => {
        const nom = u.nombre || '';
        const pat = u.apPaterno || '';
        const mat = u.apMaterno || '';
        const nombreCompleto = `${nom} ${pat} ${mat}`.trim() || 'Sin Nombre';
        const usuarioNick = u.usuario || 'N/A';

        tbody.innerHTML += `
          <tr>
            <td><strong style="color: var(--accent-neon-purple);">${usuarioNick}</strong></td>
            <td>${nombreCompleto}</td>
            <td>${u.correo || 'N/A'}</td>
            <td>${u.telefono || 'N/A'}</td>
            <td>${u.rol || 'Solo Lectura'}</td>
            <td><span class="${u.estado === 'Inactivo' ? 'badge-inactive' : 'badge-active'}">${u.estado || 'Activo'}</span></td>
            <td>
              <button class="btn btn-primary" onclick="prepararEdicion('${u._id}')" style="padding:0.3rem 0.6rem; font-size:0.7rem;">Editar</button>
              <button class="btn btn-danger" onclick="eliminarUsuario('${u._id}')" style="padding:0.3rem 0.6rem; font-size:0.7rem;">Eliminar</button>
            </td>
          </tr>
        `;
      });
    } catch (err) {
      console.error('Error cargando usuarios:', err);
    }
  }

  function prepararEdicion(id) {
    const u = listaUsuariosCache.find(user => user._id === id);
    if (!u) return;

    document.getElementById('u-id').value = u._id;
    document.getElementById('u-nombre').value = u.nombre || '';
    document.getElementById('u-appaterno').value = u.apPaterno || '';
    document.getElementById('u-apmaterno').value = u.apMaterno || '';
    document.getElementById('u-usuario').value = u.usuario || '';
    document.getElementById('u-correo').value = u.correo || '';
    document.getElementById('u-telefono').value = u.telefono || '';
    document.getElementById('u-identificacion').value = u.identificacion || '';
    document.getElementById('u-direccion').value = u.direccion || '';
    document.getElementById('u-rol').value = u.rol || 'Administrador';
    document.getElementById('u-estado').value = u.estado || 'Activo';
    
    // Al editar, la contraseña no es requerida en el HTML si no se quiere cambiar
    const passInput = document.getElementById('u-password');
    passInput.value = '';
    passInput.removeAttribute('required');

    document.getElementById('form-title').textContent = 'Modificar Usuario';
    document.getElementById('btn-user-submit').textContent = 'Actualizar Usuario';
    document.getElementById('btn-cancel').style.display = 'inline-block';
  }

  function limpiarFormulario() {
    document.getElementById('user-form').reset();
    document.getElementById('u-id').value = '';
    document.getElementById('u-password').setAttribute('required', 'true');
    document.getElementById('form-title').textContent = 'Control y Edición de Usuarios';
    document.getElementById('btn-user-submit').textContent = 'Guardar Registro';
    document.getElementById('btn-cancel').style.display = 'none';
  }

  document.getElementById('user-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-user-submit');
    btn.disabled = true;
    btn.textContent = 'Guardando...';

    const id = document.getElementById('u-id').value;
    const data = {
      nombre: document.getElementById('u-nombre').value.trim(),
      apPaterno: document.getElementById('u-appaterno').value.trim(),
      apMaterno: document.getElementById('u-apmaterno').value.trim(),
      usuario: document.getElementById('u-usuario').value.trim(),
      correo: document.getElementById('u-correo').value.trim(),
      telefono: document.getElementById('u-telefono').value.trim(),
      identificacion: document.getElementById('u-identificacion').value.trim(),
      direccion: document.getElementById('u-direccion').value.trim(),
      rol: document.getElementById('u-rol').value,
      estado: document.getElementById('u-estado').value
    };

    const pwd = document.getElementById('u-password').value;
    if (pwd) {
      data.password = pwd;
    }

    try {
      const res = await fetch(id ? `${API_USERS}/${id}` : API_USERS, {
        method: id ? 'PUT' : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });

      const resData = await res.json();
      if (!res.ok) {
        throw new Error(resData.error || 'Error en la petición al servidor');
      }

      limpiarFormulario();
      await cargarUsuarios();
    } catch (err) {
      alert('Error: ' + err.message);
    } finally {
      btn.disabled = false;
      if (!document.getElementById('u-id').value) {
        btn.textContent = 'Guardar Registro';
      } else {
        btn.textContent = 'Actualizar Usuario';
      }
    }
  });

  async function eliminarUsuario(id) {
    if (confirm('¿Eliminar este usuario de la base de datos?')) {
      try {
        const res = await fetch(`${API_USERS}/${id}`, { method: 'DELETE' });
        if (!res.ok) {
          const errData = await res.json();
          throw new Error(errData.error || 'No se pudo eliminar');
        }
        cargarUsuarios();
      } catch (err) {
        alert('Error al eliminar: ' + err.message);
      }
    }
  }

  cargarUsuarios();
</script>
</body>
</html>
