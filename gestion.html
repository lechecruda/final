<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GamerVault - Administración de Inventario</title>
  <style>
    :root {
      --bg-dark: #0a0814;
      --card-bg: #15102a;
      --border-color: #2e2055;
      --accent-purple: #a855f7;
      --accent-neon-purple: #d8b4fe;
      --accent-glow: #9333ea;
      --text-main: #f3e8ff;
      --text-muted: #a78bfa;
      --danger: #f43f5e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

    header {
      background-color: var(--card-bg);
      border-bottom: 2px solid var(--accent-glow);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo { color: var(--accent-neon-purple); font-size: 1.5rem; text-transform: uppercase; font-weight: bold; }
    nav a { color: var(--text-muted); text-decoration: none; margin-left: 1.5rem; font-weight: 600; }
    nav a:hover, nav a.active { color: var(--accent-neon-purple); text-shadow: 0 0 8px var(--accent-glow); }

    .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; width: 100%; }

    .form-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }

    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
    .input-group { display: flex; flex-direction: column; gap: 0.4rem; }
    .input-group.full-width { grid-column: 1 / -1; }
    .input-group label { font-size: 0.85rem; color: var(--text-muted); }
    .input-group input, .input-group select, .input-group textarea {
      background-color: var(--bg-dark);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.6rem;
      border-radius: 4px;
      outline: none;
    }

    .btn { padding: 0.6rem 1.2rem; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; text-transform: uppercase; font-size: 0.8rem; }
    .btn-primary { background-color: var(--accent-purple); color: white; margin-top: 1rem; }
    .btn-danger { background-color: var(--danger); color: white; }

    table { width: 100%; border-collapse: collapse; background-color: var(--card-bg); border-radius: 8px; overflow: hidden; }
    th, td { padding: 0.8rem 1rem; border-bottom: 1px solid var(--border-color); text-align: left; }
    th { background-color: #0d0a1d; color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; }
  </style>
</head>
<body>

  <header>
    <div class="logo">🎮 GamerVault</div>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="productos.html">Catálogo</a>
      <a href="gestion.html" class="active">Gestión (CRUD)</a>
      <a href="usuarios.html">Usuarios</a>
    </nav>
  </header>

  <div class="container">
    <div class="form-card">
      <h2>Registrar / Modificar Producto</h2>
      <br>
      <form id="crud-form">
        <input type="hidden" id="prod-id">
        <div class="form-grid">
          <div class="input-group">
            <label>Código SKU / Barras</label>
            <input type="text" id="p-sku" placeholder="SKU-8849" required>
          </div>
          <div class="input-group">
            <label>Nombre del Producto</label>
            <input type="text" id="p-nombre" placeholder="Ej. Mouse Gamer 16k DPI" required>
          </div>
          <div class="input-group">
            <label>Marca</label>
            <input type="text" id="p-marca" placeholder="Logitech / Corsair">
          </div>
          <div class="input-group">
            <label>Categoría</label>
            <select id="p-categoria" required>
              <option value="Periféricos">Periféricos</option>
              <option value="Componentes">Componentes</option>
              <option value="Consolas">Consolas</option>
              <option value="Accesorios">Accesorios</option>
            </select>
          </div>
          <div class="input-group">
            <label>Precio ($)</label>
            <input type="number" step="0.01" id="p-precio" placeholder="0.00" required>
          </div>
          <div class="input-group">
            <label>Stock</label>
            <input type="number" id="p-stock" placeholder="0" required>
          </div>
          <div class="input-group">
            <label>Proveedor</label>
            <input type="text" id="p-proveedor" placeholder="Asus México">
          </div>
          <div class="input-group">
            <label>Ubicación Almacén</label>
            <input type="text" id="p-ubicacion" placeholder="Estante A-2">
          </div>
          <div class="input-group full-width">
            <label>Descripción detallada</label>
            <textarea id="p-descripcion" rows="2" placeholder="Especificaciones técnicas..."></textarea>
          </div>
        </div>
        <button type="submit" id="btn-submit" class="btn btn-primary">Guardar Registro</button>
      </form>
    </div>

    <table>
      <thead>
        <tr>
          <th>SKU</th>
          <th>Producto</th>
          <th>Marca</th>
          <th>Categoría</th>
          <th>Precio</th>
          <th>Stock</th>
          <th>Ubicación</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tabla-body">
      </tbody>
    </table>
  </div>

<script>
  const API_URL = '/api/productos';

  async function cargarProductos() {
    try {
      const res = await fetch(API_URL);
      const productos = await res.json();
      const tbody = document.getElementById('tabla-body');
      tbody.innerHTML = '';

      if (!Array.isArray(productos) || productos.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; color:var(--text-muted);">Sin productos en la base de datos</td></tr>';
        return;
      }

      productos.forEach(p => {
        tbody.innerHTML += `
          <tr>
            <td>${p.sku || '#N/A'}</td>
            <td>${p.nombre}</td>
            <td>${p.marca || 'Generico'}</td>
            <td>${p.categoria}</td>
            <td>$${Number(p.precio).toFixed(2)}</td>
            <td>${p.stock}</td>
            <td>${p.ubicacion || 'General'}</td>
            <td>
              <button class="btn btn-primary" onclick="editar('${p._id}', '${p.sku}', '${p.nombre}', '${p.marca}', '${p.categoria}', ${p.precio}, ${p.stock}, '${p.proveedor}', '${p.ubicacion}', '${p.descripcion}')" style="padding:0.3rem 0.6rem; font-size:0.7rem;">Editar</button>
              <button class="btn btn-danger" onclick="eliminar('${p._id}')" style="padding:0.3rem 0.6rem; font-size:0.7rem;">Baja</button>
            </td>
          </tr>
        `;
      });
    } catch (err) {
      console.error('Error al cargar productos:', err);
    }
  }

  document.getElementById('crud-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-submit');
    btn.disabled = true;
    btn.textContent = 'Guardando...';

    const id = document.getElementById('prod-id').value;
    const data = {
      sku: document.getElementById('p-sku').value,
      nombre: document.getElementById('p-nombre').value,
      marca: document.getElementById('p-marca').value,
      categoria: document.getElementById('p-categoria').value,
      precio: parseFloat(document.getElementById('p-precio').value),
      stock: parseInt(document.getElementById('p-stock').value),
      proveedor: document.getElementById('p-proveedor').value,
      ubicacion: document.getElementById('p-ubicacion').value,
      descripcion: document.getElementById('p-descripcion').value
    };

    try {
      const res = await fetch(id ? `${API_URL}/${id}` : API_URL, {
        method: id ? 'PUT' : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });

      const resData = await res.json();
      if (!res.ok) throw new Error(resData.error || 'Error al guardar');

      document.getElementById('crud-form').reset();
      document.getElementById('prod-id').value = '';
      await cargarProductos();
    } catch (err) {
      alert('Error: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Guardar Registro';
    }
  });

  function editar(id, sku, nombre, marca, categoria, precio, stock, proveedor, ubicacion, descripcion) {
    document.getElementById('prod-id').value = id;
    document.getElementById('p-sku').value = sku;
    document.getElementById('p-nombre').value = nombre;
    document.getElementById('p-marca').value = marca;
    document.getElementById('p-categoria').value = categoria;
    document.getElementById('p-precio').value = precio;
    document.getElementById('p-stock').value = stock;
    document.getElementById('p-proveedor').value = proveedor;
    document.getElementById('p-ubicacion').value = ubicacion;
    document.getElementById('p-descripcion').value = descripcion;
  }

  async function eliminar(id) {
    if (confirm('¿Deseas dar de baja este producto?')) {
      try {
        await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
        cargarProductos();
      } catch (err) {
        console.error('Error al eliminar:', err);
      }
    }
  }

  cargarProductos();
</script>
</body>
</html>
