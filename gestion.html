<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GamerVault - Administración de Inventario</title>
  <style>
    :root {
      --bg-dark: #0a0814;
      --card-bg: #15102a;
      --border-color: #2e2055;
      --accent-purple: #a855f7;
      --accent-neon-purple: #d8b4fe;
      --accent-glow: #9333ea;
      --text-main: #f3e8ff;
      --text-muted: #a78bfa;
      --danger: #f43f5e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

    header {
      background-color: var(--card-bg);
      border-bottom: 2px solid var(--accent-glow);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo { color: var(--accent-neon-purple); font-size: 1.5rem; text-transform: uppercase; font-weight: bold; }
    nav a { color: var(--text-muted); text-decoration: none; margin-left: 1.5rem; font-weight: 600; }
    nav a:hover, nav a.active { color: var(--accent-neon-purple); text-shadow: 0 0 8px var(--accent-glow); }

    .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; width: 100%; }

    .form-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }

    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
    .input-group { display: flex; flex-direction: column; gap: 0.4rem; }
    .input-group label { font-size: 0.85rem; color: var(--text-muted); }
    .input-group input, .input-group select {
      background-color: var(--bg-dark);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.6rem;
      border-radius: 4px;
      outline: none;
    }

    .btn {
      padding: 0.6rem 1.2rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 0.8rem;
    }
    .btn-primary { background-color: var(--accent-purple); color: white; margin-top: 1rem; }
    .btn-danger { background-color: var(--danger); color: white; }

    table { width: 100%; border-collapse: collapse; background-color: var(--card-bg); border-radius: 8px; overflow: hidden; }
    th, td { padding: 0.8rem 1rem; border-bottom: 1px solid var(--border-color); text-align: left; }
    th { background-color: #0d0a1d; color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; }
  </style>
</head>
<body>

  <header>
    <div class="logo">🎮 GamerVault</div>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="productos.html">Catálogo</a>
      <a href="gestion.html" class="active">Gestión (CRUD)</a>
      <a href="usuarios.html">Usuarios</a>
    </nav>
  </header>

  <div class="container">
    <div class="form-card">
      <h2>Registrar / Modificar Producto</h2>
      <br>
      <form id="crud-form">
        <div class="form-grid">
          <div class="input-group">
            <label>Nombre del Producto</label>
            <input type="text" placeholder="Ej. Mouse Gamer 16k DPI" required>
          </div>
          <div class="input-group">
            <label>Categoría</label>
            <select required>
              <option value="Periféricos">Periféricos</option>
              <option value="Componentes">Componentes</option>
              <option value="Consolas">Consolas</option>
            </select>
          </div>
          <div class="input-group">
            <label>Precio ($)</label>
            <input type="number" step="0.01" placeholder="0.00" required>
          </div>
          <div class="input-group">
            <label>Stock</label>
            <input type="number" placeholder="0" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Guardar Registro</button>
      </form>
    </div>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Producto</th>
          <th>Categoría</th>
          <th>Precio</th>
          <th>Stock</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>#101</td>
          <td>Teclado Mecánico RGB</td>
          <td>Periféricos</td>
          <td>$79.99</td>
          <td>12</td>
          <td>
            <button class="btn btn-primary" style="padding:0.3rem 0.6rem; font-size:0.7rem;">Editar</button>
            <button class="btn btn-danger" style="padding:0.3rem 0.6rem; font-size:0.7rem;">Baja</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</body>
</html>
